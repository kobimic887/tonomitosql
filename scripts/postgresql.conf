# Connection settings
listen_addresses = '*'
max_connections = 100

# Memory settings tuned for RDKit cartridge GiST index builds (~3M molecules)
shared_buffers = 2048MB
work_mem = 64MB
maintenance_work_mem = 2048MB
effective_cache_size = 4096MB

# Similarity search also sets this per-session. Keep the server default off so
# pooled sessions that skip the SET cannot DiskFull a 64MB /dev/shm.
max_parallel_workers_per_gather = 0

# WAL settings for faster bulk loading
wal_buffers = 64MB
checkpoint_completion_target = 0.9
max_wal_size = 2GB

# Logging
log_min_messages = warning
log_min_error_statement = error
